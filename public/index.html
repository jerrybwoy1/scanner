<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QikReach Data Refinery</title>
<style>
:root{color-scheme:dark;--bg:#030712;--card:#0b0f19;--field:#111827;--green:#00ffcc;--red:#ff3158;--yellow:#ffd166;--muted:#94a3b8}
*{box-sizing:border-box;font-family:ui-monospace,monospace}
html,body{min-height:100%}body{margin:0;padding:14px;background:var(--bg);color:var(--green)}
h1{text-align:center;font-size:clamp(20px,5vw,30px);border-bottom:2px solid var(--green);padding-bottom:12px}
.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1.5fr;gap:14px}
.card{background:var(--card);border:1px solid var(--green);padding:16px}
input,button,a{width:100%;min-height:48px;margin:6px 0;padding:11px;border:1px solid var(--green);background:var(--field);color:var(--green);font-size:16px;border-radius:0}
input{display:block;pointer-events:auto;touch-action:manipulation;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
button{cursor:pointer;font-weight:800}button:disabled{opacity:.65;cursor:wait}.red{border-color:var(--red);color:var(--red)}
.search-status{min-height:64px;margin:10px 0;padding:12px;border:2px solid #334155;background:#070b12;color:#cbd5e1;white-space:pre-wrap;line-height:1.45}
.search-status.working{border-color:var(--yellow);color:var(--yellow)}
.search-status.success{border-color:var(--green);color:var(--green)}
.search-status.notice{border-color:var(--yellow);color:var(--yellow)}
.search-status.error{border-color:var(--red);color:var(--red)}
.api-state{font-size:12px;color:var(--muted);margin:8px 0}
details{margin:8px 0;border:1px solid #334155;background:#070b12}summary{cursor:pointer;padding:12px;font-weight:800;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:'+';float:right}details[open] summary:after{content:'−'}
.advanced{padding:0 12px 12px}.advanced-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.advanced input{margin:0}.advanced-actions{display:flex;gap:8px}.muted{font-size:12px;color:var(--muted);line-height:1.4}
.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--green);padding:7px;text-align:left;font-size:12px}#log{height:160px;overflow:auto;background:#000;padding:10px;font-size:12px;white-space:pre-wrap}
@media(max-width:800px){.grid{grid-template-columns:1fr}body{padding:9px}.advanced-grid{grid-template-columns:1fr}.advanced-actions{display:grid;grid-template-columns:1fr 1fr}input{min-height:52px}}
</style>
</head>
<body>
<h1>QIKREACH DATA REFINERY</h1>
<main class="grid">
<section class="card">
<h2>Spreadsheet Enrichment</h2>
<input id="file" type="file" accept=".xlsx">
<button id="batch" class="red" type="button">PROCESS WORKBOOK</button>
<div id="batchStatus" class="api-state"></div>
<div id="download"></div>
</section>
<section class="card">
<h2>Cloud Vault Search</h2>
<input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Example: John Doe in Connecticut or 917-207-7745">
<button id="search" type="button">SEARCH</button>
<details id="advanced">
<summary>ADVANCED SEARCH</summary>
<div class="advanced">
<div class="advanced-grid">
<input id="name" placeholder="Name"><input id="company" placeholder="Company">
<input id="phone" inputmode="tel" placeholder="Phone"><input id="email" inputmode="email" placeholder="Email">
<input id="ein" placeholder="EIN"><input id="state" placeholder="State or abbreviation">
<input id="zip" inputmode="numeric" placeholder="ZIP code"><input id="address" placeholder="Address, city or street">
</div>
<div class="advanced-actions"><button id="clearAdvanced" type="button">CLEAR</button><button id="advancedSearch" type="button">SEARCH FIELDS</button></div>
<div class="muted">Multiple fields narrow results. Formatting and close misspellings are normalized.</div>
</div>
</details>
<div id="apiState" class="api-state">Checking search service…</div>
<div id="searchStatus" class="search-status" role="status" aria-live="assertive">Waiting for a search.</div>
<div id="results"></div>
<h3>Activity</h3><div id="log"></div>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const log=message=>{$('log').textContent+=`[${new Date().toLocaleTimeString()}] ${message}\n`;$('log').scrollTop=$('log').scrollHeight};
const setStatus=(message,state='')=>{$('searchStatus').textContent=message;$('searchStatus').className=`search-status ${state}`.trim()};
async function readResponse(response){const text=await response.text();if(!text)return{};try{return JSON.parse(text)}catch{return{error:text.slice(0,500)}}}
function fields(){return{name:$('name').value.trim(),company:$('company').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),ein:$('ein').value.trim(),state:$('state').value.trim(),zip:$('zip').value.trim(),address:$('address').value.trim()}}
function hasFields(value){return Object.values(value).some(Boolean)}
let redirecting=false;
function resetExpiredSession(){if(redirecting)return;redirecting=true;setStatus('SESSION RESET\nYour old login is no longer valid. Returning to the sign-in page…','notice');$('apiState').textContent='Resetting expired session';setTimeout(()=>window.location.replace(`/logout?expired=1&ts=${Date.now()}`),700)}
async function health(){
 try{
  const response=await fetch(`/api/health?ts=${Date.now()}`,{credentials:'same-origin',cache:'no-store',headers:{accept:'application/json'}});
  if(response.status===401){resetExpiredSession();return false}
  const data=await readResponse(response);
  if(!response.ok){const message=data.error||`Server error ${response.status}`;$('apiState').textContent='Search service unavailable';setStatus(`SEARCH SERVICE ERROR\n${message}\nThe database was not searched.`,'error');return false}
  $('apiState').textContent='Search service connected';return true
 }catch(error){const message=error instanceof Error?error.message:'Network request failed';$('apiState').textContent='Cannot reach search service';setStatus(`NETWORK ERROR\n${message}\nThe database was not searched.`,'error');return false}
}
async function runSearch(){
 const query=$('q').value.trim(),advanced=fields(),button=$('search'),fieldButton=$('advancedSearch');
 if(!query&&!hasFields(advanced)){setStatus('NOTHING TO SEARCH\nEnter a name, company, phone, email, EIN, state, ZIP, or an advanced field.','error');$('q').focus();return}
 button.disabled=true;fieldButton.disabled=true;button.textContent='SEARCHING…';$('results').replaceChildren();
 setStatus('SEARCHING\nConnecting to the vault and normalizing the search…','working');
 try{
  if(!await health())return;
  const response=await fetch(`/api/search?ts=${Date.now()}`,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({query,fields:advanced})});
  if(response.status===401){resetExpiredSession();return}
  const data=await readResponse(response);
  if(!response.ok){const message=data.error||`Search failed (${response.status})`;setStatus(`SEARCH FAILED\n${message}\nNo search results were produced.`,'error');log(`Search failed: ${message}`);return}
  const rows=Array.isArray(data.results)?data.results:[];
  const interpreted=[];if(data.normalized_query)interpreted.push(`text “${data.normalized_query}”`);if(data.interpreted_state)interpreted.push(`state “${data.interpreted_state}”`);if(data.interpreted_zip)interpreted.push(`ZIP “${data.interpreted_zip}”`);
  const detail=interpreted.length?`\nUnderstood as ${interpreted.join(', ')}.`:'';
  if(rows.length===0){setStatus(`NO MATCHES FOUND\nThe search completed successfully, but the vault returned zero matching records.${detail}\nThis can also mean the workbook data has not been uploaded yet.`,'notice');log(`Search completed: 0 matches for ${query||'advanced fields'}`);return}
  $('results').innerHTML=`<div class="table"><table><tr><th>Company</th><th>Owner</th><th>Address</th><th>Phone</th><th>Email</th><th>Revenue</th><th>Match</th></tr>${rows.map(row=>`<tr><td>${esc(row.company_name)}</td><td>${esc(row.owner_name)}</td><td>${esc(row.address)}</td><td>${esc(row.all_phones)}</td><td>${esc(row.all_emails)}</td><td>${esc(row.revenue)}</td><td>${esc(row.match_score)}%</td></tr>`).join('')}</table></div>`;
  setStatus(`SEARCH COMPLETE\nFound ${rows.length} possible match${rows.length===1?'':'es'}.${detail}`,'success');log(`Search completed: ${rows.length} match(es)`)
 }catch(error){const message=error instanceof Error?error.message:'Unknown browser error';setStatus(`BROWSER OR NETWORK ERROR\n${message}\nThe search did not complete.`,'error');log(`Search exception: ${message}`)}
 finally{button.disabled=false;fieldButton.disabled=false;button.textContent='SEARCH'}
}
$('search').addEventListener('click',runSearch);$('advancedSearch').addEventListener('click',runSearch);
$('q').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();runSearch()}});
document.querySelectorAll('.advanced input').forEach(input=>input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();runSearch()}}));
$('clearAdvanced').addEventListener('click',()=>{document.querySelectorAll('.advanced input').forEach(input=>input.value='');setStatus('Advanced fields cleared.','')});
$('batch').addEventListener('click',async()=>{const file=$('file').files[0];if(!file){$('batchStatus').textContent='Select an .xlsx file first.';return}$('batch').disabled=true;$('batchStatus').textContent='Processing workbook…';try{const form=new FormData();form.append('file',file);const response=await fetch('/api/batch',{method:'POST',credentials:'same-origin',body:form});if(response.status===401){resetExpiredSession();return}if(!response.ok){const data=await readResponse(response);$('batchStatus').textContent=data.error||`Processing failed (${response.status})`;return}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`qikreach-enriched-${Date.now()}.xlsx`;link.textContent='DOWNLOAD ENRICHED WORKBOOK';$('download').replaceChildren(link);$('batchStatus').textContent='Workbook processed and saved to the vault.'}catch(error){$('batchStatus').textContent=error instanceof Error?error.message:'Processing failed'}finally{$('batch').disabled=false}});
log('QikReach search interface loaded');health();
</script>
</body>
</html>
