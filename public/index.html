<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QikReach Data Refinery</title><style>:root{color-scheme:dark;--b:#030712;--p:#0b0f19;--f:#111827;--g:#00ffcc;--r:#ff3158;--y:#ffd166}*{box-sizing:border-box;font-family:ui-monospace,monospace}html,body{min-height:100%;touch-action:manipulation}body{margin:0;padding:14px;background:var(--b);color:var(--g)}h1{text-align:center;font-size:clamp(20px,5vw,30px);border-bottom:2px solid var(--g);padding-bottom:12px}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1.5fr;gap:14px}.card{position:relative;background:var(--p);border:1px solid var(--g);padding:16px}input,button,a{width:100%;min-height:46px;margin:6px 0;padding:11px;border:1px solid var(--g);background:var(--f);color:var(--g);font-size:16px;border-radius:0}input{position:relative;z-index:2;display:block;pointer-events:auto;touch-action:manipulation;cursor:text;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}input[type=file]{cursor:pointer}button,a{position:relative;z-index:1;cursor:pointer;text-align:center;text-decoration:none;font-weight:800;touch-action:manipulation}button:hover,a:hover{background:var(--g);color:#00110d}button:disabled{cursor:wait;opacity:.65}.red{border-color:var(--r);color:var(--r)}#log{height:180px;overflow:auto;background:#000;padding:10px;font-size:12px;white-space:pre-wrap}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--g);padding:7px;text-align:left;font-size:12px}.status{min-height:24px;color:#aab2c0}.search-status{min-height:42px;margin:8px 0 4px;padding:10px 12px;border:1px solid #334155;background:#070b12;color:#aab2c0;font-size:14px;line-height:1.4}.search-status.working{border-color:var(--y);color:var(--y)}.search-status.success{border-color:var(--g);color:var(--g)}.search-status.error{border-color:var(--r);color:var(--r)}details{margin:8px 0;border:1px solid #334155;background:#070b12}summary{cursor:pointer;padding:12px;font-weight:800;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"+";float:right}details[open] summary:after{content:"−"}.advanced{padding:0 12px 12px}.advanced-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.advanced input{margin:0}.advanced-actions{display:flex;gap:8px}.advanced-actions button{margin-top:8px}.muted{color:#94a3b8;font-size:12px;line-height:1.4}.match-note{display:block;color:#94a3b8;margin-top:3px}.match-score{white-space:nowrap}@media(max-width:800px){.grid{grid-template-columns:1fr}body{padding:9px}.card{overflow:visible}input{min-height:52px}.advanced-grid{grid-template-columns:1fr}.advanced-actions{display:grid;grid-template-columns:1fr 1fr}}</style></head><body><h1>QIKREACH DATA REFINERY</h1><main class="grid"><section class="card"><h2>Spreadsheet Enrichment</h2><input id="file" type="file" accept=".xlsx"><button id="batch" class="red" type="button">PROCESS WORKBOOK</button><div id="status" class="status"></div><div id="download"></div><p><a href="/logout">LOG OUT</a></p></section><section class="card"><h2>Cloud Vault Search</h2><input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Example: John Doe in Connecticut or John Doe 06902" aria-label="Search cloud vault"><button id="search" type="button">SEARCH</button><details id="advanced"><summary>ADVANCED SEARCH</summary><div class="advanced"><div class="advanced-grid"><input id="name" placeholder="Name"><input id="company" placeholder="Company"><input id="phone" inputmode="tel" placeholder="Phone"><input id="email" inputmode="email" placeholder="Email"><input id="ein" placeholder="EIN"><input id="state" placeholder="State or abbreviation"><input id="zip" inputmode="numeric" placeholder="ZIP code"><input id="address" placeholder="Address, city or street"></div><div class="advanced-actions"><button id="clearAdvanced" type="button">CLEAR</button><button id="advancedSearch" type="button">SEARCH FIELDS</button></div><div class="muted">Multiple fields narrow the same search. Misspellings and common formatting differences are normalized.</div></div></details><div id="searchStatus" class="search-status" role="status" aria-live="polite">Type a natural search or open Advanced Search for multiple fields.</div><div id="results"></div><h3>Activity</h3><div id="log"></div></section></main><script>"use strict";const $=x=>document.getElementById(x),log=m=>{$("log").textContent+=`[${new Date().toLocaleTimeString()}] ${m}\n`},esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),setSearchStatus=(message,state="")=>{const el=$("searchStatus");el.textContent=message;el.className=`search-status ${state}`.trim()};async function readJson(response){const text=await response.text();if(!text)return{};try{return JSON.parse(text)}catch{return{error:text.slice(0,300)}}}function fields(){return{name:$("name").value.trim(),company:$("company").value.trim(),phone:$("phone").value.trim(),email:$("email").value.trim(),ein:$("ein").value.trim(),state:$("state").value.trim(),zip:$("zip").value.trim(),address:$("address").value.trim()}}function hasFields(f){return Object.values(f).some(Boolean)}async function search(){const q=$("q").value.trim(),f=fields(),button=$("search");if(!q&&!hasFields(f)){setSearchStatus("Enter a natural search or at least one advanced field.","error");$("q").focus();return}button.disabled=true;button.textContent="SEARCHING…";setSearchStatus("Searching and normalizing your criteria…","working");$("results").innerHTML="";try{const r=await fetch(window.location.origin+"/api/search",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json","accept":"application/json"},body:JSON.stringify({query:q,fields:f})});if(r.status===401){setSearchStatus("Your session expired. Reloading login…","error");window.location.reload();return}const d=await readJson(r);if(!r.ok)throw new Error(d.error||`Search failed (${r.status})`);const rows=Array.isArray(d.results)?d.results:[],parts=[];if(d.normalized_query)parts.push(`text: ${d.normalized_query}`);if(d.interpreted_state)parts.push(`state: ${d.interpreted_state}`);if(d.interpreted_zip)parts.push(`ZIP: ${d.interpreted_zip}`);const interpreted=parts.length?` Interpreted ${parts.join(", ")}.`:"";if(rows.length){$("results").innerHTML=`<div class=table><table><tr><th>Company</th><th>Owner</th><th>Address</th><th>Phone</th><th>Email</th><th>Revenue</th><th>Match</th></tr>${rows.map(x=>`<tr><td>${esc(x.company_name)}</td><td>${esc(x.owner_name)}</td><td>${esc(x.address)}</td><td>${esc(x.all_phones)}</td><td>${esc(x.all_emails)}</td><td>${esc(x.revenue)}</td><td class=match-score>${esc(x.match_score)}%</td></tr>`).join("")}</table></div>`;setSearchStatus(`Found ${rows.length} possible match${rows.length===1?"":"es"}.${interpreted}`,"success")}else setSearchStatus(`No matches found.${interpreted} Try fewer filters or another spelling.`,"error");log(`Search: ${rows.length} result(s)${interpreted}`)}catch(error){const message=error instanceof Error?error.message:"Search failed";setSearchStatus(`Search error: ${message}`,"error");log(`Search error: ${message}`)}finally{button.disabled=false;button.textContent="SEARCH"}}$("search").onclick=search;$("advancedSearch").onclick=search;$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();search()}});document.querySelectorAll(".advanced input").forEach(input=>input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();search()}}));$("clearAdvanced").onclick=()=>{document.querySelectorAll(".advanced input").forEach(input=>input.value="");setSearchStatus("Advanced fields cleared.")};$("q").addEventListener("input",()=>{if($("q").value.trim())setSearchStatus("Ready. Natural language, state names, abbreviations and ZIP codes are accepted.")});$("batch").onclick=async()=>{const f=$("file").files[0];if(!f)return $("status").textContent="Select an .xlsx file";$("batch").disabled=true;$("status").textContent="Processing in Cloudflare…";const fd=new FormData();fd.append("file",f);const r=await fetch(window.location.origin+"/api/batch",{method:"POST",credentials:"same-origin",body:fd});if(r.status===401)return location.reload();if(!r.ok){const d=await readJson(r);$("status").textContent=d.error||"Processing failed";log(d.error||"Processing failed");$("batch").disabled=false;return}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=`qikreach-enriched-${Date.now()}.xlsx`;a.textContent="DOWNLOAD ENRICHED WORKBOOK";$("download").replaceChildren(a);$("status").textContent="Complete";$("batch").disabled=false;log("Workbook processed and leads saved in D1")};log("Cloudflare mobile app ready")</script></body></html>
