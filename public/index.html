<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QikReach Live Enrichment</title>
<style>
:root{color-scheme:dark;--bg:#030712;--panel:#0b0f19;--field:#111827;--green:#00ffcc;--red:#ff3158;--yellow:#ffd166;--muted:#94a3b8}
*{box-sizing:border-box;font-family:ui-monospace,monospace}
body{margin:0;padding:12px;background:var(--bg);color:var(--green)}
h1{font-size:clamp(22px,6vw,34px);text-align:center}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--green);padding:16px}
input,button,a{width:100%;min-height:50px;margin:6px 0;padding:12px;border:1px solid var(--green);background:var(--field);color:var(--green);font-size:16px;border-radius:0}
input{-webkit-appearance:none;appearance:none}button{font-weight:800;cursor:pointer}button:disabled{opacity:.6}.red{border-color:var(--red);color:var(--red)}
details{margin:8px 0;border:1px solid #334155;background:#070b12}summary{padding:12px;font-weight:800;cursor:pointer;list-style:none}summary:after{content:'+';float:right}details[open] summary:after{content:'−'}
.advanced{padding:0 12px 12px}.advanced-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.advanced-grid input{margin:0}
.status{margin:10px 0;padding:12px;border:2px solid #334155;background:#070b12;white-space:pre-wrap;line-height:1.45}.status.working{border-color:var(--yellow);color:var(--yellow)}.status.success{border-color:var(--green);color:var(--green)}.status.error{border-color:var(--red);color:var(--red)}.status.none{border-color:var(--yellow);color:var(--yellow)}
.meta{font-size:12px;color:var(--muted);margin:6px 0}.stage,.source{border:1px solid #334155;padding:10px;margin:8px 0;background:#070b12}.source a{display:inline;width:auto;min-height:0;margin:0;padding:0;border:0;background:transparent;font-size:13px;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{border:1px solid #334155;padding:4px 6px;font-size:12px;color:#cbd5e1}.table{overflow:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--green);padding:7px;text-align:left;font-size:12px}#log{height:160px;overflow:auto;background:#000;padding:10px;font-size:12px;white-space:pre-wrap}
@media(max-width:800px){.grid{grid-template-columns:1fr}.advanced-grid{grid-template-columns:1fr}body{padding:8px}}
</style>
</head>
<body>
<h1>QIKREACH LIVE ENRICHMENT</h1>
<main class="grid">
<section class="card">
<h2>Spreadsheet Enrichment</h2>
<input id="file" type="file" accept=".xlsx">
<button id="batch" class="red" type="button">PROCESS WORKBOOK</button>
<div id="batchStatus" class="meta"></div><div id="download"></div>
</section>
<section class="card">
<h2>Live Search + Scraping</h2>
<input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Name, company, phone, email, EIN, state or ZIP">
<button id="search" type="button">SEARCH & ENRICH</button>
<details><summary>ADVANCED SEARCH</summary><div class="advanced"><div class="advanced-grid">
<input id="name" placeholder="Name"><input id="company" placeholder="Company"><input id="phone" inputmode="tel" placeholder="Phone"><input id="email" inputmode="email" placeholder="Email"><input id="ein" placeholder="EIN"><input id="state" placeholder="State"><input id="zip" inputmode="numeric" placeholder="ZIP"><input id="address" placeholder="Address or city">
</div><button id="clear" type="button">CLEAR FIELDS</button></div></details>
<div id="health" class="meta">Checking service…</div>
<div id="status" class="status">Enter a search and press SEARCH & ENRICH.</div>
<div id="stages"></div><div id="results"></div><div id="sources"></div>
<h3>Activity</h3><div id="log"></div>
</section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const log=message=>{$("log").textContent+=`[${new Date().toLocaleTimeString()}] ${message}\n`;$("log").scrollTop=$("log").scrollHeight};
function setStatus(text,state=""){const element=$("status");element.textContent=text;element.className=`status ${state}`.trim()}
async function read(response){const text=await response.text();try{return JSON.parse(text)}catch{return{error:text||`HTTP ${response.status}`}}}
function fields(){return{name:$("name").value.trim(),company:$("company").value.trim(),phone:$("phone").value.trim(),email:$("email").value.trim(),ein:$("ein").value.trim(),state:$("state").value.trim(),zip:$("zip").value.trim(),address:$("address").value.trim()}}
async function health(){try{const response=await fetch(`/api/health?ts=${Date.now()}`,{cache:"no-store"});const data=await read(response);if(!response.ok)throw new Error(data.error||"Health check failed");$("health").textContent=`Public access • Vault: ${data.vault_count} records • Browser Run: ${data.browser_run?"ready":"not enabled"} • Brave: ${data.brave_configured?"configured":"fallback discovery"}`;return true}catch(error){$("health").textContent=`Service unavailable: ${error.message}`;return false}}
function renderStages(stages){$("stages").innerHTML=stages.map(stage=>`<div class="stage"><strong>${esc(stage.stage)}</strong><div>${esc(stage.status)}</div><div class="meta">${esc(Object.entries(stage).filter(([key])=>!["stage","status"].includes(key)).map(([key,value])=>`${key}: ${value}`).join(" • "))}</div></div>`).join("")}
function renderVault(rows){if(!rows.length){$("results").innerHTML="";return}$("results").innerHTML=`<h3>Vault Matches</h3><div class="table"><table><tr><th>Company</th><th>Owner</th><th>Address</th><th>Phone</th><th>Email</th><th>Match</th></tr>${rows.map(row=>`<tr><td>${esc(row.company_name)}</td><td>${esc(row.owner_name)}</td><td>${esc(row.address)}</td><td>${esc(row.all_phones)}</td><td>${esc(row.all_emails)}</td><td>${esc(row.match_score)}%</td></tr>`).join("")}</table></div>`}
function renderSources(rows){if(!rows.length){$("sources").innerHTML='<div class="status none">NO PUBLIC SOURCES RETURNED\nThe live discovery provider returned no usable pages.</div>';return}$("sources").innerHTML=`<h3>Public Sources Checked</h3>${rows.map(source=>`<div class="source"><strong>${esc(source.title||"Untitled source")}</strong><div><a href="${esc(source.url)}" target="_blank" rel="noopener">${esc(source.url)}</a></div><div class="meta">${esc(source.provider)} • ${esc(source.fetch_mode||source.status)}</div><div class="chips">${(source.phones||[]).map(value=>`<span class="chip">${esc(value)}</span>`).join("")}${(source.emails||[]).map(value=>`<span class="chip">${esc(value)}</span>`).join("")}${!(source.phones||[]).length&&!(source.emails||[]).length?'<span class="chip">No contact data extracted</span>':""}</div>${source.error?`<div class="meta">${esc(source.error)}</div>`:""}</div>`).join("")}`}
async function search(){const query=$("q").value.trim(),filters=fields();if(!query&&!Object.values(filters).some(Boolean)){setStatus("NOTHING TO SEARCH\nEnter at least one search value.","error");return}const button=$("search");button.disabled=true;button.textContent="SEARCHING…";$("stages").innerHTML="";$("results").innerHTML="";$("sources").innerHTML="";setStatus("SEARCHING\nChecking stored records, discovering public pages, opening sources, extracting contacts, and saving findings.","working");log(`Started live enrichment: ${query||"advanced fields"}`);try{const response=await fetch(`/api/search?ts=${Date.now()}`,{method:"POST",cache:"no-store",headers:{"content-type":"application/json","accept":"application/json"},body:JSON.stringify({query,fields:filters})});const data=await read(response);if(!response.ok)throw new Error(data.error||`Search failed (${response.status})`);renderStages(data.stages||[]);renderVault(data.results||[]);renderSources(data.sources||[]);const vaultMatches=(data.results||[]).length;const contacts=(data.sources||[]).reduce((total,source)=>total+(source.phones||[]).length+(source.emails||[]).length,0);if(vaultMatches||contacts)setStatus(`SEARCH COMPLETE\nVault matches: ${vaultMatches}\nPublic pages checked: ${(data.sources||[]).length}\nContact findings: ${contacts}\nElapsed: ${(data.elapsed_ms/1000).toFixed(1)} seconds`,"success");else setStatus(`SEARCH COMPLETE — NO CONTACT RESULTS\nThe search completed, but no matching contact information was found.\nPublic pages checked: ${(data.sources||[]).length}`,"none");log(`Completed: ${vaultMatches} vault matches, ${contacts} public findings`);await health()}catch(error){setStatus(`SEARCH FAILED\n${error.message}\nNo success was recorded.`,"error");log(`Failed: ${error.message}`)}finally{button.disabled=false;button.textContent="SEARCH & ENRICH"}}
$("search").onclick=search;$("q").addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();search()}});document.querySelectorAll(".advanced input").forEach(input=>input.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();search()}}));$("clear").onclick=()=>document.querySelectorAll(".advanced input").forEach(input=>input.value="");
$("batch").onclick=async()=>{const file=$("file").files[0];if(!file){$("batchStatus").textContent="Select an .xlsx file";return}const button=$("batch");button.disabled=true;$("batchStatus").textContent="Processing…";try{const form=new FormData();form.append("file",file);const response=await fetch("/api/batch",{method:"POST",body:form});if(!response.ok){const data=await read(response);throw new Error(data.error||"Processing failed")}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=`qikreach-enriched-${Date.now()}.xlsx`;link.textContent="DOWNLOAD ENRICHED WORKBOOK";$("download").replaceChildren(link);$("batchStatus").textContent="Complete";await health()}catch(error){$("batchStatus").textContent=error.message}finally{button.disabled=false}};
log("Public live-enrichment app ready");health();
</script>
</body>
</html>
