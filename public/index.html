<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QikReach Live Enrichment</title><style>:root{color-scheme:dark;--bg:#030712;--panel:#0b0f19;--field:#111827;--green:#00ffcc;--red:#ff3158;--yellow:#ffd166;--muted:#94a3b8}*{box-sizing:border-box;font-family:ui-monospace,monospace}body{margin:0;padding:12px;background:var(--bg);color:var(--green)}h1{font-size:clamp(22px,6vw,34px);text-align:center}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1.6fr;gap:14px}.card{background:var(--panel);border:1px solid var(--green);padding:16px}input,button,a{width:100%;min-height:50px;margin:6px 0;padding:12px;border:1px solid var(--green);background:var(--field);color:var(--green);font-size:16px;border-radius:0}input{position:relative;z-index:2;-webkit-appearance:none;appearance:none}button{font-weight:800;cursor:pointer}button:disabled{opacity:.6}.red{border-color:var(--red);color:var(--red)}details{margin:8px 0;border:1px solid #334155;background:#070b12}summary{padding:12px;font-weight:800;cursor:pointer;list-style:none}summary:after{content:'+';float:right}details[open] summary:after{content:'−'}.advanced{padding:0 12px 12px}.advanced-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.advanced-grid input{margin:0}.status{margin:10px 0;padding:12px;border:2px solid #334155;background:#070b12;white-space:pre-wrap;line-height:1.45}.status.working{border-color:var(--yellow);color:var(--yellow)}.status.success{border-color:var(--green);color:var(--green)}.status.error{border-color:var(--red);color:var(--red)}.status.none{border-color:var(--yellow);color:var(--yellow)}.meta{font-size:12px;color:var(--muted);margin:6px 0}.stage,.source{border:1px solid #334155;padding:10px;margin:8px 0;background:#070b12}.stage strong,.source strong{color:var(--green)}.source a{display:inline;width:auto;min-height:0;margin:0;padding:0;border:0;background:transparent;font-size:13px;word-break:break-all}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{border:1px solid #334155;padding:4px 6px;font-size:12px;color:#cbd5e1}.table{overflow:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--green);padding:7px;text-align:left;font-size:12px}#log{height:160px;overflow:auto;background:#000;padding:10px;font-size:12px;white-space:pre-wrap}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.advanced-grid{grid-template-columns:1fr}body{padding:8px}}</style></head><body><h1>QIKREACH LIVE ENRICHMENT</h1><main class="grid"><section class="card"><h2>Spreadsheet Enrichment</h2><input id="file" type="file" accept=".xlsx"><button id="batch" class="red" type="button">PROCESS WORKBOOK</button><div id="batchStatus" class="meta"></div><div id="download"></div></section><section class="card"><h2>Live Search + Scraping</h2><input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Name, company, phone, email, EIN, state or ZIP"><button id="search" type="button">SEARCH & ENRICH</button><details><summary>ADVANCED SEARCH</summary><div class="advanced"><div class="advanced-grid"><input id="name" placeholder="Name"><input id="company" placeholder="Company"><input id="phone" inputmode="tel" placeholder="Phone"><input id="email" inputmode="email" placeholder="Email"><input id="ein" placeholder="EIN"><input id="state" placeholder="State"><input id="zip" inputmode="numeric" placeholder="ZIP"><input id="address" placeholder="Address or city"></div><button id="clear" type="button">CLEAR FIELDS</button></div></details><div id="health" class="meta">Checking service…</div><div id="status" class="status">Enter a search and press SEARCH & ENRICH.</div><div id="stages"></div><div id="results"></div><div id="sources"></div><h3>Activity</h3><div id="log"></div></section></main><script>"use strict";const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),log=m=>{$('log').textContent+=`[${new Date().toLocaleTimeString()}] ${m}\n`; $('log').scrollTop=$('log').scrollHeight};function setStatus(text,state=''){const el=$('status');el.textContent=text;el.className=`status ${state}`.trim()}async function read(r){const t=await r.text();try{return JSON.parse(t)}catch{return{error:t||`HTTP ${r.status}`}}}async function redirectLogin(){location.href='/logout'}function fields(){return{name:$('name').value.trim(),company:$('company').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),ein:$('ein').value.trim(),state:$('state').value.trim(),zip:$('zip').value.trim(),address:$('address').value.trim()}}async function health(){try{const r=await fetch(`/api/health?ts=${Date.now()}`,{cache:'no-store'}),d=await read(r);if(!r.ok)throw new Error(d.error||'Health check failed');$('health').textContent=`Vault: ${d.vault_count} records • Browser Run: ${d.browser_run?'ready':'not enabled'} • Brave: ${d.brave_configured?'configured':'fallback discovery'}`;return true}catch(e){$('health').textContent=`Service unavailable: ${e.message}`;return false}}function renderStages(stages){$('stages').innerHTML=stages.map(s=>`<div class=stage><strong>${esc(s.stage)}</strong><div>${esc(s.status)}</div><div class=meta>${esc(Object.entries(s).filter(([k])=>!['stage','status'].includes(k)).map(([k,v])=>`${k}: ${v}`).join(' • '))}</div></div>`).join('')}function renderVault(rows){if(!rows.length){$('results').innerHTML='';return}$('results').innerHTML=`<h3>Vault Matches</h3><div class=table><table><tr><th>Company</th><th>Owner</th><th>Address</th><th>Phone</th><th>Email</th><th>Match</th></tr>${rows.map(r=>`<tr><td>${esc(r.company_name)}</td><td>${esc(r.owner_name)}</td><td>${esc(r.address)}</td><td>${esc(r.all_phones)}</td><td>${esc(r.all_emails)}</td><td>${esc(r.match_score)}%</td></tr>`).join('')}</table></div>`}function renderSources(rows){if(!rows.length){$('sources').innerHTML='<div class="status none">NO PUBLIC SOURCES RETURNED\nThe vault search completed, but the live discovery provider returned no usable pages.</div>';return}$('sources').innerHTML=`<h3>Public Sources Checked</h3>${rows.map(s=>`<div class=source><strong>${esc(s.title||'Untitled source')}</strong><div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div><div class=meta>${esc(s.provider)} • ${esc(s.fetch_mode||s.status)}</div><div class=chips>${(s.phones||[]).map(x=>`<span class=chip>${esc(x)}</span>`).join('')}${(s.emails||[]).map(x=>`<span class=chip>${esc(x)}</span>`).join('')}${!(s.phones||[]).length&&!(s.emails||[]).length?'<span class=chip>No contact data extracted</span>':''}</div>${s.error?`<div class=meta>${esc(s.error)}</div>`:''}</div>`).join('')}`}async function search(){const query=$('q').value.trim(),f=fields();if(!query&&!Object.values(f).some(Boolean)){setStatus('NOTHING TO SEARCH\nEnter at least one search value.','error');return}const b=$('search');b.disabled=true;b.textContent='SEARCHING…';$('stages').innerHTML='';$('results').innerHTML='';$('sources').innerHTML='';setStatus('SEARCHING\n1. Checking the vault\n2. Discovering public pages\n3. Opening result pages\n4. Extracting phones and emails\n5. Saving confirmed findings','working');log(`Started live enrichment: ${query||'advanced fields'}`);try{const r=await fetch(`/api/search?ts=${Date.now()}`,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({query,fields:f})});const d=await read(r);if(r.status===401){setStatus('SESSION EXPIRED\nReturning to login…','error');setTimeout(redirectLogin,600);return}if(!r.ok)throw new Error(d.error||`Search failed (${r.status})`);renderStages(d.stages||[]);renderVault(d.results||[]);renderSources(d.sources||[]);const found=(d.results||[]).length,contacts=(d.sources||[]).reduce((n,s)=>n+(s.phones||[]).length+(s.emails||[]).length,0);if(found||contacts)setStatus(`SEARCH COMPLETE\nVault matches: ${found}\nPublic pages checked: ${(d.sources||[]).length}\nContact findings: ${contacts}\nElapsed: ${(d.elapsed_ms/1000).toFixed(1)} seconds`,'success');else setStatus(`SEARCH COMPLETE — NO CONTACT RESULTS\nThe vault and public web were checked successfully, but no matching contact information was found.\nPublic pages checked: ${(d.sources||[]).length}`,'none');log(`Completed: ${found} vault matches, ${contacts} public findings`);await health()}catch(e){setStatus(`SEARCH FAILED\n${e.message}\nNo success was recorded.`,'error');log(`Failed: ${e.message}`)}finally{b.disabled=false;b.textContent='SEARCH & ENRICH'}}$('search').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});document.querySelectorAll('.advanced input').forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}}));$('clear').onclick=()=>document.querySelectorAll('.advanced input').forEach(x=>x.value='');$('batch').onclick=async()=>{const f=$('file').files[0];if(!f){$('batchStatus').textContent='Select an .xlsx file';return}const b=$('batch');b.disabled=true;$('batchStatus').textContent='Processing…';try{const fd=new FormData();fd.append('file',f);const r=await fetch('/api/batch',{method:'POST',credentials:'same-origin',body:fd});if(r.status===401){await redirectLogin();return}if(!r.ok){const d=await read(r);throw new Error(d.error||'Processing failed')}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`qikreach-enriched-${Date.now()}.xlsx`;a.textContent='DOWNLOAD ENRICHED WORKBOOK';$('download').replaceChildren(a);$('batchStatus').textContent='Complete';await health()}catch(e){$('batchStatus').textContent=e.message}finally{b.disabled=false}};log('Live enrichment app ready');health();</script></body></html>
