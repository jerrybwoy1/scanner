<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QikReach Live Enrichment</title>
<style>
:root{color-scheme:dark;--bg:#030712;--panel:#0b0f19;--field:#111827;--green:#00ffcc;--red:#ff3158;--yellow:#ffd166;--muted:#94a3b8}*{box-sizing:border-box;font-family:ui-monospace,monospace}body{margin:0;padding:12px;background:var(--bg);color:var(--green)}h1{text-align:center;font-size:clamp(22px,6vw,34px)}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1.6fr;gap:14px}.card{background:var(--panel);border:1px solid var(--green);padding:16px}input,button{width:100%;min-height:50px;margin:6px 0;padding:12px;border:1px solid var(--green);background:var(--field);color:var(--green);font-size:16px;border-radius:0}button{font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.red{border-color:var(--red);color:var(--red)}details{margin:8px 0;border:1px solid #334155;background:#070b12}summary{padding:12px;font-weight:800;cursor:pointer;list-style:none}summary:after{content:'+';float:right}details[open] summary:after{content:'−'}.advanced{padding:0 12px 12px}.advanced-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.advanced-grid input{margin:0}.check{display:flex;align-items:center;gap:8px;color:#cbd5e1;font-size:13px;margin:10px 0}.check input{width:auto;min-height:0;margin:0}.status{margin:10px 0;padding:12px;border:2px solid #334155;background:#070b12;white-space:pre-wrap;line-height:1.45}.working{border-color:var(--yellow);color:var(--yellow)}.success{border-color:var(--green);color:var(--green)}.error{border-color:var(--red);color:var(--red)}.none{border-color:var(--yellow);color:var(--yellow)}.meta{font-size:12px;color:var(--muted);margin:6px 0;white-space:pre-wrap}.source{border:1px solid #334155;padding:10px;margin:8px 0;background:#070b12}.source a{color:var(--green);word-break:break-all}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.chip{border:1px solid #334155;padding:4px 6px;font-size:12px;color:#cbd5e1}#log{height:160px;overflow:auto;background:#000;padding:10px;font-size:12px;white-space:pre-wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}.advanced-grid{grid-template-columns:1fr}body{padding:8px}}
</style>
</head>
<body>
<h1>QIKREACH LIVE ENRICHMENT</h1>
<main class="grid">
<section class="card">
<h2>Spreadsheet Enrichment</h2>
<input id="file" type="file" accept=".xlsx">
<button id="batch" class="red" type="button">PROCESS WORKBOOK</button>
<div id="batchStatus" class="meta"></div><div id="download"></div>
</section>
<section class="card">
<h2>Live Search + Scraping</h2>
<input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Name, company, phone, email, EIN, state or ZIP">
<button id="search" type="button">SEARCH & SCRAPE</button>
<details><summary>ADVANCED SEARCH</summary><div class="advanced"><div class="advanced-grid">
<input id="company" placeholder="Company"><input id="person" placeholder="Person or owner"><input id="phone" inputmode="tel" placeholder="Phone"><input id="email" inputmode="email" placeholder="Email"><input id="ein" placeholder="EIN"><input id="state" placeholder="State"><input id="address" placeholder="Address or city"><input id="proxy" placeholder="Optional http/socks proxy URL">
</div><label class="check"><input id="verify" type="checkbox" checked>Verify email domains by MX</label><button id="clear" type="button">CLEAR FIELDS</button></div></details>
<div id="health" class="meta">Checking Python backend…</div>
<div id="status" class="status">Enter a search and press SEARCH & SCRAPE.</div>
<div id="results"></div><div id="sources"></div><h3>Activity</h3><div id="log"></div>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const log=m=>{$('log').textContent+=`[${new Date().toLocaleTimeString()}] ${m}\n`; $('log').scrollTop=$('log').scrollHeight};
function status(text,state=''){const el=$('status');el.textContent=text;el.className=`status ${state}`.trim()}
async function read(response){const text=await response.text();try{return JSON.parse(text)}catch{return{error:text||`HTTP ${response.status}`}}}
function fields(){return{company:$('company').value.trim(),person:$('person').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),ein:$('ein').value.trim(),state:$('state').value.trim(),address:$('address').value.trim()}}
async function health(){try{const response=await fetch(`/api/health?ts=${Date.now()}`,{cache:'no-store'}),data=await read(response);if(!response.ok)throw new Error(data.error||data.detail||'Backend health check failed');$('health').textContent=`Python backend connected • Search: ${data.search_ready?'ready':'not ready'} • Browser crawler: ${data.browser_crawler_ready?'ready':'fallback only'} • Proxy: ${data.proxy_ready?'ready':'not ready'} • Batch: ${data.batch_ready?'ready':'not ready'}`;return true}catch(error){$('health').textContent=`Python backend unavailable: ${error.message}`;return false}}
function render(result){const phones=result.phones||[],emails=result.emails||[],sources=result.sources||[];$('results').innerHTML=`<h3>Results</h3><div class=meta>Status: ${esc(result.status)} • Discovered: ${esc(result.discovered_count)} • Scraped: ${esc(result.scraped_count)} • Relevant: ${esc(result.relevant_count)} • Duration: ${esc(result.duration_seconds)}s</div><div class=chips>${phones.map(x=>`<span class=chip>${esc(x.number)}${x.extension?` x${esc(x.extension)}`:''}</span>`).join('')}${emails.map(x=>`<span class=chip>${esc(x.email)} [${esc(x.domain_status)}]</span>`).join('')}${!phones.length&&!emails.length?'<span class=chip>No verified contacts extracted</span>':''}</div>`;$('sources').innerHTML=`<h3>Sources Checked</h3>${sources.map(s=>`<div class=source><strong>${esc(s.title||'Untitled')}</strong><div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div><div class=meta>${esc(s.status)} • ${esc(s.method||'')} • relevance ${esc(s.relevance??0)}</div>${s.error?`<div class=meta>${esc(s.error)}</div>`:''}</div>`).join('')||'<div class="status none">No public sources were discovered.</div>'}`}
async function search(){const query=$('q').value.trim(),advanced=fields();if(!query&&!Object.values(advanced).some(Boolean)){status('NOTHING TO SEARCH\nEnter at least one search value.','error');return}const button=$('search');button.disabled=true;button.textContent='SEARCHING…';$('results').innerHTML='';$('sources').innerHTML='';status('SEARCHING\nDiscovering public sources, opening pages, checking relevance, extracting phones and emails, and verifying domains.','working');log(`Search started: ${query||'advanced fields'}`);try{const response=await fetch('/api/search',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({query,fields:advanced,proxy:$('proxy').value.trim(),verify_email_domains:$('verify').checked,use_ollama:false})}),data=await read(response);if(!response.ok)throw new Error(data.detail||data.error||`Search failed (${response.status})`);render(data.result);const result=data.result,contacts=(result.phones||[]).length+(result.emails||[]).length;if(contacts)status(`SEARCH COMPLETE\nFound ${contacts} contact item(s).\nChecked ${(result.sources||[]).length} source page(s).`,'success');else status(`SEARCH COMPLETE — NO CONTACT RESULTS\nChecked ${(result.sources||[]).length} source page(s).\nResult status: ${result.status}`,'none');log(`Search complete: ${contacts} contact item(s)`)}catch(error){status(`SEARCH FAILED\n${error.message}`,'error');log(`Search failed: ${error.message}`)}finally{button.disabled=false;button.textContent='SEARCH & SCRAPE'}}
$('search').onclick=search;$('q').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();search()}});document.querySelectorAll('.advanced input').forEach(input=>input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();search()}}));$('clear').onclick=()=>{document.querySelectorAll('.advanced input').forEach(input=>input.value='');status('Advanced fields cleared.')};
$('batch').onclick=async()=>{const file=$('file').files[0];if(!file){$('batchStatus').textContent='Select an .xlsx workbook';return}const button=$('batch');button.disabled=true;$('batchStatus').textContent='Uploading and enriching workbook…';try{const form=new FormData();form.append('file',file);form.append('concurrency','2');form.append('delay','0');form.append('proxy',$('proxy').value.trim());form.append('verify_email_domains',String($('verify').checked));form.append('use_ollama','false');const response=await fetch('/api/batch',{method:'POST',body:form});if(!response.ok){const data=await read(response);throw new Error(data.detail||data.error||'Batch failed')}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`qikreach-enriched-${Date.now()}.xlsx`;link.textContent='DOWNLOAD ENRICHED WORKBOOK';$('download').replaceChildren(link);$('batchStatus').textContent='Complete'}catch(error){$('batchStatus').textContent=`Failed: ${error.message}`}finally{button.disabled=false}};
log('Mobile browser interface ready');health();
</script>
</body>
</html>
