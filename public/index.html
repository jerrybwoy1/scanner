<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QikReach Data Refinery</title><style>:root{color-scheme:dark;--b:#030712;--p:#0b0f19;--f:#111827;--g:#00ffcc;--r:#ff3158}*{box-sizing:border-box;font-family:ui-monospace,monospace}html,body{min-height:100%;touch-action:manipulation}body{margin:0;padding:14px;background:var(--b);color:var(--g)}h1{text-align:center;font-size:clamp(20px,5vw,30px);border-bottom:2px solid var(--g);padding-bottom:12px}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1.5fr;gap:14px}.card{position:relative;background:var(--p);border:1px solid var(--g);padding:16px}input,button,a{width:100%;min-height:46px;margin:6px 0;padding:11px;border:1px solid var(--g);background:var(--f);color:var(--g);font-size:16px;border-radius:0}input{position:relative;z-index:2;display:block;pointer-events:auto;touch-action:manipulation;cursor:text;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}input[type=file]{cursor:pointer}button,a{position:relative;z-index:1;cursor:pointer;text-align:center;text-decoration:none;font-weight:800;touch-action:manipulation}button:hover,a:hover{background:var(--g);color:#00110d}.red{border-color:var(--r);color:var(--r)}#log{height:180px;overflow:auto;background:#000;padding:10px;font-size:12px;white-space:pre-wrap}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--g);padding:7px;text-align:left;font-size:12px}.status{min-height:24px;color:#aab2c0}@media(max-width:800px){.grid{grid-template-columns:1fr}body{padding:9px}.card{overflow:visible}input{min-height:52px}}</style></head><body><h1>QIKREACH DATA REFINERY</h1><main class="grid"><section class="card"><h2>Spreadsheet Enrichment</h2><input id="file" type="file" accept=".xlsx"><button id="batch" class="red" type="button">PROCESS WORKBOOK</button><div id="status" class="status"></div><div id="download"></div><p><a href="/logout">LOG OUT</a></p></section><section class="card"><h2>Cloud Vault Search</h2><input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Name, company, phone, email or EIN" aria-label="Search cloud vault"><button id="search" type="button">SEARCH</button><div id="results"></div><h3>Activity</h3><div id="log"></div></section></main><script>"use strict";const $=x=>document.getElementById(x),log=m=>{$("log").textContent+=`[${new Date().toLocaleTimeString()}] ${m}\n`},esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function search(){const q=$("q").value.trim();if(!q)return;const r=await fetch("/api/search",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({query:q})});if(r.status===401)return location.reload();const d=await r.json();if(!r.ok)return log(d.error);const rows=d.results||[];$("results").innerHTML=rows.length?`<div class=table><table><tr><th>Company</th><th>Owner</th><th>Phone</th><th>Email</th><th>Revenue</th></tr>${rows.map(x=>`<tr><td>${esc(x.company_name)}</td><td>${esc(x.owner_name)}</td><td>${esc(x.all_phones)}</td><td>${esc(x.all_emails)}</td><td>${esc(x.revenue)}</td></tr>`).join("")}</table></div>`:"No matches";log(`Search: ${rows.length} result(s)`) }$("search").onclick=search;$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();search()}});$("batch").onclick=async()=>{const f=$("file").files[0];if(!f)return $("status").textContent="Select an .xlsx file";$("batch").disabled=true;$("status").textContent="Processing in Cloudflare…";const fd=new FormData();fd.append("file",f);const r=await fetch("/api/batch",{method:"POST",body:fd});if(r.status===401)return location.reload();if(!r.ok){const d=await r.json();$("status").textContent=d.error;log(d.error);$("batch").disabled=false;return}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=`qikreach-enriched-${Date.now()}.xlsx`;a.textContent="DOWNLOAD ENRICHED WORKBOOK";$("download").replaceChildren(a);$("status").textContent="Complete";$("batch").disabled=false;log("Workbook processed and leads saved in D1")};log("Cloudflare mobile app ready")</script></body></html>
